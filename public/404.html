<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello, 9emdesign Branding & Marketing Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/9emIcon001.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/9emIcon001.png" />
    <link rel="shortcut icon" href="/9emIcon001.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/9emIcon001.png" />

    <!-- Font Preloads for Fast Rendering & DevTools Optimization -->
    <link
      rel="preload"
      href="assets/fonts/Antonio-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/Antonio-Light.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/Antonio-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/Fredoka.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Speculation Rules API for Chrome DevTools Speculative Loads & Prerendering -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "list",
            "urls": [
              "/",
              "/aboutUs",
              "/designConcept",
              "/whatWeDo",
              "/howWeWork",
              "/contactUs",
              "/service_form"
            ]
          }
        ],
        "prefetch": [
          {
            "source": "document",
            "where": {
              "href_matches": "/*"
            }
          }
        ]
      }
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-7DVH2L4ERE"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7DVH2L4ERE");
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
