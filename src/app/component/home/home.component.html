<main class="home-container">
  <section class="hero-section" aria-label="Hero Section">
    <!-- Desktop & TV Title Layout (1 line) -->
    <h1 class="title-desktop-tv">
      <span class="letter">9emdesign</span>
    </h1>

    <!-- Tablet Title Layout (2 lines) -->
    <div class="title-tablet" aria-hidden="true">
      <h1 class="row-1">
        <span class="letter">9em</span>
      </h1>
      <h1 class="row-2">
        <span class="letter">design</span>
      </h1>
    </div>

    <!-- Mobile Title Layout (3 lines) -->
    <div class="title-mobile" aria-hidden="true">
      <h1 class="row-1">
        <span class="letter">9em</span>
        <!--  <span class="letter">e</span>
        <span class="letter">m</span> -->
      </h1>
      <h1 class="row-2">
        <span class="letter">des</span>
      </h1>
      <h1 class="row-3">ign</h1>
    </div>

    <!-- Subheading Hello (Desktop, TV) -->
    <h2 class="hello-subheading">Hello</h2>

    <!-- Decorative & Structural Content Blocks (Frame 4 & Frame 3 from JSON) -->
    <article class="hero-block-container">
      <div class="hero-block"></div>
      <div class="accent-bar"></div>
    </article>

    <!-- Hero Image Container Layer (Mobile, Tablet, Desktop) -->
    <aside class="image-wrapper">
      <div
        class="background-image-element"
        aria-label="Dude looking up background image"
      ></div>
    </aside>

    <!-- TV Specific Ultra-Wide Layout -->
    <div class="tv-layout-wrapper">
      <aside class="tv-left-column">
        <div
          class="tv-background-image"
          aria-label="Dude standing at wall background image"
        ></div>
      </aside>
      <section class="tv-right-column"></section>
    </div>
  </section>
</main>
